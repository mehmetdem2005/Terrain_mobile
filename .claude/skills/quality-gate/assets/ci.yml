# MobileTerrain3D CI — quality-gate skill'inin kurduğu şablon.
# Kurulum hedefi: .github/workflows/ci.yml
# Standart izlenebilirliği: docs/STANDARDS.md 2.7 (OpenSSF Scorecard: CI zorunlu),
# 1.7 (ISO 29119: her değişiklik test kanıtıyla).
name: ci
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/godot
          key: godot-4.6.2-stable-linux-x86_64

      - name: Install Godot 4.6.2 headless
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip"
          unzip -o /tmp/godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.6.2-stable_linux.x86_64 /usr/local/bin/godot

      - name: Godot version
        run: godot --version

      - name: Run full test pipeline
        run: bash test/run_all.sh

      - name: Validate skills governance
        run: bash scripts/validate_skills.sh

      - name: Release pre-check (uyumluluk raporu, bloklamaz)
        run: bash scripts/release_build.sh --check || true
