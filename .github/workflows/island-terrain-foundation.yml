name: IslandTerrain Foundation

on:
  pull_request:
    paths:
      - "addons/island_terrain/**"
      - "project.godot"
      - ".github/workflows/island-terrain-foundation.yml"
  push:
    branches:
      - "agent/island-terrain-foundation"
    paths:
      - "addons/island_terrain/**"
      - "project.godot"
      - ".github/workflows/island-terrain-foundation.yml"

permissions:
  contents: read

jobs:
  godot-headless:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6.3
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Engine version
        run: godot --version

      - name: Parse project and load editor plugin
        run: godot --headless --path . --editor --quit-after 3

      - name: Run foundation tests
        run: godot --headless --path . --script addons/island_terrain/test/foundation_test.gd
